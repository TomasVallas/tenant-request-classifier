[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Keeps test files in the project, so runs do not depend on the system temp folder.
addopts = "--basetemp=.pytest_tmp"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
